<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Спасибо за вашу заявку на консультацию. Мы свяжемся с вами в ближайшее время.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://bacteriofak.github.io/Solalott/thank-you.html">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Спасибо! Заявка принята - Стоп-Атака</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .thank-you-wrapper {
            font-family: 'Inter', sans-serif;
            color: #34495E;
            line-height: 1.7;
        }
        
        .thank-you-section {
            background: linear-gradient(135deg, rgba(74, 144, 164, 0.05), rgba(107, 144, 128, 0.05));
            padding: 100px 0;
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
        }
        
        .thank-you-card {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        
        .thank-you-card h1 {
            font-family: 'Playfair Display', serif;
            color: #2C3E50;
            font-size: 42px;
            margin-bottom: 25px;
            font-weight: 700;
        }
        
        .thank-you-card p {
            font-size: 18px;
            color: #7F8C8D;
            margin: 0;
        }
        
        @media (max-width: 768px) {
            .thank-you-section {
                padding: 60px 0;
            }
            
            .thank-you-card {
                padding: 40px 25px;
            }
            
            .thank-you-card h1 {
                font-size: 32px;
                margin-bottom: 20px;
            }
            
            .thank-you-card p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="thank-you-wrapper">
    <header class="top-header">
        <div class="container header-content">
            <div class="header-wrapper">
                <a href="index.html" class="logo">
                    <i class="fas fa-hand-holding-heart"></i>
                    <span>Стоп-Атака</span>
                </a>
            </div>
        </div>
    </header>

    <section class="thank-you-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 offset-lg-2">
                    <div class="thank-you-card">
                        <h1>Спасибо! Ваша заявка принята</h1>
                        <p>Мы получили вашу информацию и свяжемся с вами в ближайшее время.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
